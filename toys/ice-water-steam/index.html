<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ice, Water, Steam · Poke & See</title>
<link rel="icon" href="../../kit/logo/poke-and-see-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../kit/tokens.css">
<link rel="stylesheet" href="../../kit/kit.css">
<style>
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{height:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:var(--space-3);
  padding:max(var(--space-3),env(safe-area-inset-top,0px)) max(var(--space-4),env(safe-area-inset-right,0px)) max(var(--space-3),env(safe-area-inset-bottom,0px)) max(var(--space-4),env(safe-area-inset-left,0px));
  user-select:none;-webkit-user-select:none}
button{touch-action:manipulation}

/* top bar: home, the word and the number, sound */
.top{display:flex;align-items:center;gap:var(--space-3)}
.top .mid{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:var(--space-4)}
.top .ps-round{flex:none}
.sound .off{display:none}
.sound[aria-pressed="false"] .on{display:none}
.sound[aria-pressed="false"] .off{display:block}
.ps-chip{display:inline-flex;align-items:center;min-height:var(--target-min);cursor:pointer;transition:background-color .25s,color .25s}
.ps-chip.pop{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}
.num{background:none;border:0;padding:6px 4px 0;min-width:3.4ch;min-height:var(--target-min);text-align:left;cursor:pointer}
.num:focus-visible{outline:4px solid var(--focus);outline-offset:4px}

/* the World */
.stage{flex:1 1 auto;min-height:240px;position:relative;border-radius:var(--radius-l);overflow:hidden;background:var(--card);transition:background-color .4s}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* the one big control */
.slider{display:flex;align-items:center;gap:var(--space-3)}
.slider .end{flex:none;width:52px;height:52px}
.slider .ps-slider-wrap{flex:1;min-width:0}
.ps-slider{--ps-track:linear-gradient(90deg,var(--ice) 0 14.29%,var(--water) 14.29% 85.71%,var(--steam) 85.71% 100%)}
.ps-slider::-webkit-slider-thumb{background:var(--thumb,var(--card))}
.ps-slider::-moz-range-thumb{background:var(--thumb,var(--card))}
.ps-mark{pointer-events:none}
.m0{left:calc(36px + (100% - 72px) * .1429)}
.m100{left:calc(36px + (100% - 72px) * .8571)}
.hint{position:absolute;top:-34px;width:64px;height:40px;transform:translateX(-50%);pointer-events:none;animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{0%,100%{margin-left:-10px}50%{margin-left:10px}}

/* quick jumps */
.jumps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3)}
.jumps .ps-btn{padding-inline:var(--space-2)}

/* grown-ups corner */
.foot{position:relative;display:flex}
.foot .ps-panel{position:absolute;left:0;bottom:calc(100% + var(--space-2));z-index:5;width:min(34rem,100%)}

@media (max-width:520px){
  .top{align-items:flex-start}
  .top .mid{flex-direction:column;gap:var(--space-1)}
  .ps-chip{font-size:40px;padding:8px 20px 0}
  .num{font-size:44px;text-align:center}
  .jumps .ps-btn{flex-direction:column;gap:0;font-size:20px;min-height:84px;padding-inline:var(--space-1)}
  .jumps .ps-btn svg{width:32px;height:32px;margin-top:0}
}
@media (prefers-reduced-motion:reduce){.hint{animation:none}.ps-chip.pop{animation:none}}
</style>
</head>
<body>
<main class="app">
  <h1 class="sr">Ice, water and steam</h1>

  <div class="top">
    <a class="ps-round" href="../../" aria-label="Home">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 23L24 9l16 14v16a2 2 0 0 1-2 2H29V30h-10v11H10a2 2 0 0 1-2-2z" fill="var(--sun)" stroke="var(--ink)" stroke-width="3.5" stroke-linejoin="round"/></svg>
    </a>
    <div class="mid">
      <button class="ps-chip ps-chip--ice" id="badge" type="button">ICE</button>
      <button class="ps-readout num" id="num" type="button"><span id="numv">−10</span><small>°</small></button>
    </div>
    <button class="ps-round sound" id="sound" type="button" aria-pressed="true" aria-label="Sound">
      <svg class="on" viewBox="0 0 48 48" aria-hidden="true"><path d="M7 18h8l11-9v30l-11-9H7z" fill="var(--ink)"/><path d="M32 17c3 4 3 10 0 14M37 12c6 7 6 17 0 24" stroke="var(--ink)" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
      <svg class="off" viewBox="0 0 48 48" aria-hidden="true"><path d="M7 18h8l11-9v30l-11-9H7z" fill="var(--ink)"/><path d="M32 18l10 12M42 18L32 30" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv" role="img" aria-label="A glass on a stove. Cold makes ice, warm makes water, hot makes steam. A magnifying glass shows the water molecules inside."></canvas>
  </div>

  <div class="slider">
    <svg class="end" viewBox="0 0 48 48" aria-hidden="true"><g stroke-linecap="round"><path d="M24 5v38M7.5 14.5l33 19M7.5 33.5l33-19" stroke="var(--ink)" stroke-width="8"/><path d="M24 5v38M7.5 14.5l33 19M7.5 33.5l33-19" stroke="var(--ice)" stroke-width="3.5"/></g></svg>
    <div class="ps-slider-wrap">
      <svg class="hint" id="hint" viewBox="0 0 64 40" aria-hidden="true"><path d="M4 20l12-12v7h32V8l12 12-12 12v-7H16v7z" fill="var(--sun)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/></svg>
      <input class="ps-slider" type="range" id="temp" min="-20" max="120" step="1" value="-10" aria-label="Temperature">
      <span class="ps-mark m0">0°</span>
      <span class="ps-mark m100">100°</span>
    </div>
    <svg class="end" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4c4 9 13 13 13 25a13 13 0 0 1-26 0c0-7 4-10 6-15 2 4 3 5 5 5-1-6 0-10 2-15z" fill="var(--flame)" stroke="var(--ink)" stroke-width="3.5" stroke-linejoin="round"/><path d="M24 25c3 4 6 6 6 10a6 6 0 0 1-12 0c0-4 3-6 6-10z" fill="var(--flame-core)"/></svg>
  </div>

  <div class="jumps">
    <button class="ps-btn ps-btn--ice" id="j0" type="button" aria-current="true">
      <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="7" y="7" width="34" height="34" rx="8" fill="var(--ice)" stroke="var(--ink)" stroke-width="3.5"/><path d="M15 23v-8h8" stroke="var(--card)" stroke-width="4" fill="none" stroke-linecap="round"/></svg>ICE</button>
    <button class="ps-btn ps-btn--water" id="j1" type="button" aria-current="false">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4c6 9 13 15 13 24a13 13 0 0 1-26 0c0-9 7-15 13-24z" fill="var(--water)" stroke="var(--ink)" stroke-width="3.5" stroke-linejoin="round"/><path d="M17 28a7 7 0 0 0 5 7" stroke="var(--water-surface)" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>WATER</button>
    <button class="ps-btn ps-btn--steam" id="j2" type="button" aria-current="false">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M13 37a9 9 0 0 1-1-18 12 12 0 0 1 23-2 9 9 0 0 1 2 20z" fill="var(--steam)" stroke="var(--ink)" stroke-width="3.5" stroke-linejoin="round"/></svg>STEAM</button>
  </div>

  <div class="foot">
    <button class="ps-grownups" id="gu" type="button" aria-expanded="false" aria-controls="gupanel">
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="17" fill="var(--card)" stroke="var(--ink-soft)" stroke-width="3.5"/><circle cx="24" cy="16" r="2.6" fill="var(--ink-soft)"/><path d="M24 22v11" stroke="var(--ink-soft)" stroke-width="4" stroke-linecap="round"/></svg>For grown-ups</button>
    <div class="ps-panel" id="gupanel" hidden>
      <p class="ps-label">The science</p>
      <h3>Ice, Water, Steam</h3>
      <p>Heat makes water molecules move faster. At 0°C they let go of each other and ice melts. At 100°C they move fast enough to fly apart as steam.</p>
      <p class="ps-ask">Ask: what happens to a puddle on a hot day?</p>
    </div>
  </div>
</main>

<script src="../../kit/kit.js"></script>
<script>
(function(){
const T=PS.token;
const INK=T('ink'),CARD=T('card'),SKY=T('sky-day'),ICE=T('ice'),WATER=T('water'),SURF=T('water-surface'),STEAM=T('steam'),
  FL=T('flame'),FL2=T('flame-core'),BARK=T('bark'),LENS=T('lens'),LENSW=T('lens-water'),OXY=T('atom-oxygen'),HYD=T('atom-hydrogen');
const DIAG=parseFloat(T('stroke-diagram'))||3;
const ICE2=mix(ICE,WATER,0.3);
const WORDS=['ICE','WATER','STEAM'],SAY=['Ice','Water','Steam'];
const CHIP=['ps-chip--ice','ps-chip--water','ps-chip--steam'],FILL=[ICE,WATER,STEAM];
const reduce=PS.reducedMotion;
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const ease=x=>x*x*(3-2*x);
function rgb(c){if(c[0]==='#'){c=c.slice(1);return[0,2,4].map(i=>parseInt(c.slice(i,i+2),16))}return c.match(/[\d.]+/g).slice(0,3).map(Number)}
function mix(a,b,t){const x=rgb(a),y=rgb(b);return'rgb('+x.map((v,i)=>Math.round(v+(y[i]-v)*t)).join(',')+')'}
function alpha(c,a){return'rgba('+rgb(c).join(',')+','+a+')'}

/* ---------- layout ---------- */
const LAND={W:1000,H:600,g:{cx:290,top:190,bot:450,hw:140},by:520,lens:{x:745,y:285,r:200}};
const PORT={W:640,H:980,g:{cx:320,top:200,bot:440,hw:140},by:505,lens:{x:310,y:745,r:185}};
let LAY=LAND,scale=1,ox=0,oy=0,dpr=1;
const stage=$('stage'),cv=$('cv'),ctx=cv.getContext('2d');
function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
  dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  LAY=(w/h<1.05)?PORT:LAND;
  scale=Math.min(w/LAY.W,h/LAY.H);ox=(w-LAY.W*scale)/2;oy=(h-LAY.H*scale)/2;
}
new ResizeObserver(resize).observe(stage);resize();

/* ---------- molecules (lens space, radius 1) ---------- */
// Shape from the design system's Molecule: oxygen r22, hydrogens r12 at (±24, 18), about 104° apart.
const U=0.0041,OR=22*U,HR=12*U,HX=24*U,HY=18*U,EXT=Math.hypot(HX,HY)+HR;
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(11),COLS=4,ROWS=3,N=COLS*ROWS,GAP=0.3,D=0.22,M=[];
const slots=[];
for(let minD=0.25,tries=1;slots.length<N;tries++){
  const x=(R()*2-1)*0.8,y=-0.1+R()*0.9;
  if(Math.hypot(x,y)<=0.8&&slots.every(s=>Math.hypot(s[0]-x,s[1]-y)>minD))slots.push([x,y]);
  if(tries%5000===0)minD*=0.95;
}
slots.sort((p,q)=>p[0]-q[0]);
for(let i=0;i<N;i++){
  const c=i%COLS,r=(i/COLS)|0,lx=(c-(COLS-1)/2)*GAP,ly=(r-(ROWS-1)/2)*GAP+0.02;
  M.push({lx,ly,sx:slots[i][0],sy:slots[i][1],x:lx,y:ly,vx:0,vy:0,ph:R()*6.28,ph2:R()*6.28,
    a0:(r+c)%2?0.15:-0.15,spin:0,w:(R()<0.5?-1:1)*(0.6+R()*0.6)});
}
function sim(dt,time,temp,a,b){
  const heat=(temp+20)/140;
  const k=(1-b)*(150-110*a),damp=(1-b)*7+0.02;
  const sp=0.6+1.0*heat,slosh=0.05*Math.sin(time*0.9),spin=(0.5+1.5*heat)*(1+2*b);
  for(const m of M){
    const tx=m.lx*(1-a)+(m.sx+0.04*Math.sin(time*1.3+m.ph)+slosh)*a;
    const ty=m.ly*(1-a)+(m.sy+0.03*Math.cos(time*1.1+m.ph2))*a;
    m.vx+=((tx-m.x)*k-m.vx*damp)*dt;
    m.vy+=((ty-m.y)*k-m.vy*damp)*dt;
    if(b>0){
      let s=Math.hypot(m.vx,m.vy);
      if(s<1e-3){const an=R()*6.28;m.vx=Math.cos(an)*0.01;m.vy=Math.sin(an)*0.01;s=0.01}
      const f=1+(sp/s-1)*b*Math.min(1,dt*4);m.vx*=f;m.vy*=f;
    }
    m.x+=m.vx*dt;m.y+=m.vy*dt;
    // Tumbling: locked in ice, turning in water, spinning in steam. Wrap only when fully melted, so it never jumps.
    m.spin+=m.w*spin*a*dt;
    if(a>0.999)m.spin=((m.spin+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
  }
  for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){
    const p=M[i],q=M[j],dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy);
    if(d>0&&d<D){
      const nx=dx/d,ny=dy/d,o=(D-d)/2;
      p.x-=nx*o;p.y-=ny*o;q.x+=nx*o;q.y+=ny*o;
      const rv=(q.vx-p.vx)*nx+(q.vy-p.vy)*ny;
      if(rv<0){p.vx+=rv*nx;p.vy+=rv*ny;q.vx-=rv*nx;q.vy-=rv*ny}
    }
  }
  const lim=1-EXT-0.02;
  for(const m of M){
    const d=Math.hypot(m.x,m.y);
    if(d>lim){const nx=m.x/d,ny=m.y/d;m.x=nx*lim;m.y=ny*lim;const vn=m.vx*nx+m.vy*ny;if(vn>0){m.vx-=2*vn*nx;m.vy-=2*vn*ny}}
  }
}

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,6.2832)}
function flame(x,y,w,h){
  for(let j=0;j<2;j++){
    const s=j?0.5:1,W=w*s,H=h*s;
    ctx.beginPath();ctx.moveTo(x-W,y);
    ctx.bezierCurveTo(x-W*1.15,y-H*0.55,x-W*0.2,y-H*0.7,x,y-H);
    ctx.bezierCurveTo(x+W*0.2,y-H*0.7,x+W*1.15,y-H*0.55,x+W,y);ctx.closePath();
    ctx.fillStyle=j?FL2:FL;ctx.fill();
    if(!j){ctx.strokeStyle=INK;ctx.lineWidth=5;ctx.stroke()}
  }
}
function flake(x,y,s){
  ctx.beginPath();
  for(let i=0;i<3;i++){const an=i*Math.PI/3;ctx.moveTo(x-Math.cos(an)*s,y-Math.sin(an)*s);ctx.lineTo(x+Math.cos(an)*s,y+Math.sin(an)*s)}
  ctx.strokeStyle=INK;ctx.lineWidth=8;ctx.stroke();ctx.strokeStyle=ICE;ctx.lineWidth=3.5;ctx.stroke();
}
// One water molecule: an oxygen with two hydrogens, CPK colours, ink edges. k = lens radius.
function molecule(x,y,an,k){
  const c=Math.cos(an),s=Math.sin(an);
  ctx.lineWidth=DIAG;ctx.strokeStyle=INK;
  circle(x,y,OR*k);ctx.fillStyle=OXY;ctx.fill();ctx.stroke();
  ctx.fillStyle=HYD;
  for(const px of [-HX,HX]){circle(x+(px*c-HY*s)*k,y+(px*s+HY*c)*k,HR*k);ctx.fill();ctx.stroke()}
}

/* ---------- scene ---------- */
function draw(time,temp,a,b){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*ox,dpr*oy);
  ctx.lineJoin='round';ctx.lineCap='round';
  const {cx,top,bot,hw}=LAY.g,L=cx-hw,Rt=cx+hw,by=LAY.by;
  const amt=a*(1-b),iceAmt=1-a,innerH=bot-top-14;
  const wTop=bot-5-innerH*0.68*amt;

  /* snowflakes */
  const cold=cl(-temp/20)*Math.max(iceAmt,0.3);
  if(cold>0.02){
    ctx.globalAlpha=cold;
    const span=bot-top+170;
    for(let i=0;i<10;i++){
      const x=L-70+((i*97)%(2*hw+140)),y=top-150+((time*(reduce?4:22)+i*61)%span);
      flake(x+Math.sin(time+i)*8,y,9+(i%3)*4);
    }
    ctx.globalAlpha=1;
  }

  /* flames + burner */
  const hf=cl((temp-5)/115);
  if(hf>0.01){
    for(let i=0;i<3;i++){
      const fl=reduce?1:1+0.12*Math.sin(time*14+i*2.1);
      flame(cx-85+i*85,by+4,18+hf*14,(20+hf*46)*fl);
    }
  }
  ctx.fillStyle=INK;rr(L-34,by,2*hw+68,24,12);ctx.fill();
  rr(L-10,by+20,16,30,6);ctx.fill();rr(Rt-6,by+20,16,30,6);ctx.fill();

  /* glass */
  const r=36,gp=new Path2D();
  gp.moveTo(L,top);gp.lineTo(L,bot-r);gp.quadraticCurveTo(L,bot,L+r,bot);gp.lineTo(Rt-r,bot);gp.quadraticCurveTo(Rt,bot,Rt,bot-r);gp.lineTo(Rt,top);
  const gc=new Path2D(gp);gc.closePath();
  ctx.fillStyle=alpha(CARD,0.6);ctx.fill(gc);
  ctx.save();ctx.clip(gc);

  const amp=3+cl((temp-70)/30)*7*amt;
  function waterPath(){
    ctx.beginPath();ctx.moveTo(L-10,bot+10);ctx.lineTo(L-10,wTop);
    for(let x=L-10;x<=Rt+10;x+=8)ctx.lineTo(x,wTop+Math.sin(x*0.045+time*(3+hf*4))*amp);
    ctx.lineTo(Rt+10,bot+10);ctx.closePath();
  }
  if(amt>0.01){waterPath();ctx.fillStyle=WATER;ctx.fill()}

  /* ice cube (floats) */
  const size=150*Math.sqrt(iceAmt);
  let cubeY=bot-75;
  if(size>10){
    const shiver=reduce?0:Math.sin(time*48)*2*cl(-temp/20);
    const floor=bot-6,floatB=wTop+size*0.88;
    const cb=amt>0.02?Math.min(floor,floatB):floor;
    cubeY=cb-size/2;
    ctx.save();ctx.translate(cx+shiver,cubeY);ctx.rotate(0.07*Math.sin(time*1.6)*a);
    rr(-size/2,-size/2,size,size,size*0.18);ctx.fillStyle=ICE;ctx.fill();
    ctx.strokeStyle=INK;ctx.lineWidth=7;ctx.stroke();
    ctx.fillStyle=ICE2;rr(-size*0.36,size*0.24,size*0.72,size*0.11,size*0.055);ctx.fill();
    ctx.strokeStyle=CARD;ctx.lineWidth=Math.max(4,size*0.07);
    ctx.beginPath();ctx.moveTo(-size*0.3,-size*0.08);ctx.lineTo(-size*0.3,-size*0.3);ctx.lineTo(-size*0.08,-size*0.3);ctx.stroke();
    ctx.restore();
    if(amt>0.01){ctx.globalAlpha=0.35;waterPath();ctx.fillStyle=WATER;ctx.fill();ctx.globalAlpha=1}
  }
  if(amt>0.01){
    ctx.beginPath();
    for(let x=L-10;x<=Rt+10;x+=8){const y=wTop+Math.sin(x*0.045+time*(3+hf*4))*amp;x===L-10?ctx.moveTo(x,y):ctx.lineTo(x,y)}
    ctx.strokeStyle=SURF;ctx.lineWidth=6;ctx.stroke();
  }

  /* bubbles */
  const bi=cl((temp-60)/40)*amt;
  if(bi>0.02){
    ctx.strokeStyle=SURF;ctx.lineWidth=3.5;
    const n=Math.round(20*bi),h=bot-12-wTop;
    for(let i=0;i<n;i++){
      const u=(time*(0.7+0.6*hf)+i*0.319)%1,x=L+24+((i*53)%(2*hw-48))+Math.sin(time*5+i)*4,y=bot-12-u*h,rad=4+(i%3)*3;
      if(y>wTop+rad+4){circle(x,y,rad);ctx.stroke()}
    }
  }
  ctx.restore();

  ctx.strokeStyle=INK;ctx.lineWidth=9;ctx.stroke(gp);
  ctx.beginPath();ctx.moveTo(L,top);ctx.lineTo(L-10,top-8);ctx.moveTo(Rt,top);ctx.lineTo(Rt+10,top-8);ctx.stroke();
  ctx.strokeStyle=alpha(CARD,0.9);ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(L+18,top+26);ctx.lineTo(L+18,top+90);ctx.stroke();

  /* steam clouds */
  const w=Math.max(b,0.35*cl((temp-85)/15)*amt);
  const zoomSteamY=Math.max(60,top-90);
  if(w>0.01){
    const n=Math.ceil(11*w),C=[];
    for(let i=0;i<n;i++){
      const u=(time*(reduce?0.05:0.14)+i/11)%1;
      const grow=Math.min(1,u*5)*(u>0.75?(1-u)/0.25:1);
      const rad=(20+u*26)*grow;
      if(rad<3)continue;
      const x=cx+Math.sin(i*2.3+time*0.7)*hw*0.45+(i%2?1:-1)*u*44,y=top-6-u*(top-30);
      C.push([x-rad*.6,y,rad*.72],[x+rad*.6,y,rad*.72],[x,y-rad*.42,rad*.86]);
    }
    ctx.fillStyle=INK;for(const c of C){circle(c[0],c[1],c[2]+5);ctx.fill()}
    ctx.fillStyle=STEAM;for(const c of C){circle(c[0],c[1],c[2]);ctx.fill()}
  }

  /* zoom callout */
  const {x:lx,y:ly,r:lr}=LAY.lens;
  const waterMid=bot-5-innerH*0.68*0.5*Math.max(amt,0.4);
  const zy=iceAmt>0.5?cubeY:(b>0.5?zoomSteamY:waterMid);
  const zx=cx+(b>0.5?0:30);
  ctx.setLineDash([4,14]);ctx.strokeStyle=INK;ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(zx,zy);ctx.lineTo(lx,ly);ctx.stroke();ctx.setLineDash([]);
  circle(zx,zy,30);ctx.lineWidth=6;ctx.stroke();

  /* magnifier handle */
  const hc=Math.cos(Math.PI/4),hs=Math.sin(Math.PI/4);
  ctx.lineCap='round';
  ctx.strokeStyle=INK;ctx.lineWidth=50;ctx.beginPath();ctx.moveTo(lx+hc*lr,ly+hs*lr);ctx.lineTo(lx+hc*(lr+95),ly+hs*(lr+95));ctx.stroke();
  ctx.strokeStyle=BARK;ctx.lineWidth=34;ctx.beginPath();ctx.moveTo(lx+hc*(lr+22),ly+hs*(lr+22));ctx.lineTo(lx+hc*(lr+95),ly+hs*(lr+95));ctx.stroke();

  /* lens inside */
  circle(lx,ly,lr);ctx.fillStyle=LENS;ctx.fill();
  ctx.save();circle(lx,ly,lr-2);ctx.clip();
  if(iceAmt>0.02){ctx.globalAlpha=0.16*iceAmt;ctx.fillStyle=ICE;ctx.fillRect(lx-lr,ly-lr,lr*2,lr*2);ctx.globalAlpha=1}
  if(amt>0.02){
    ctx.globalAlpha=amt;ctx.fillStyle=LENSW;ctx.beginPath();
    const wy=ly-lr*0.14;ctx.moveTo(lx-lr,ly+lr);
    for(let x=lx-lr;x<=lx+lr;x+=10)ctx.lineTo(x,wy+Math.sin(x*0.03+time*2)*6);
    ctx.lineTo(lx+lr,ly+lr);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
  }
  const heat=(temp+20)/140;
  const jA=reduce?0.3:1,jAmp=(1-b)*(0.006+0.03*heat)*jA*(1-0.5*a),jF=18+30*heat;
  const P=M.map(m=>[lx+(m.x+Math.sin(time*jF+m.ph)*jAmp)*lr,ly+(m.y+Math.cos(time*jF*1.13+m.ph2)*jAmp)*lr,m.a0+m.spin*a+Math.sin(time*jF*0.7+m.ph)*jAmp*4]);
  /* hydrogen bonds hold the ice lattice; they let go as it melts */
  const bond=cl(1-a*3);
  if(bond>0.01){
    const u=U*lr;
    ctx.globalAlpha=0.7*bond;ctx.strokeStyle=HYD;ctx.lineWidth=4*u;ctx.setLineDash([2*u,8*u]);ctx.beginPath();
    for(let i=0;i<N;i++){const c=i%COLS;if(c<COLS-1){ctx.moveTo(P[i][0],P[i][1]);ctx.lineTo(P[i+1][0],P[i+1][1])}if(i+COLS<N){ctx.moveTo(P[i][0],P[i][1]);ctx.lineTo(P[i+COLS][0],P[i+COLS][1])}}
    ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
  }
  for(const [x,y,an] of P)molecule(x,y,an,lr);
  ctx.restore();
  circle(lx,ly,lr);ctx.strokeStyle=INK;ctx.lineWidth=18;ctx.stroke();
  ctx.strokeStyle=alpha(CARD,0.75);ctx.lineWidth=5;ctx.beginPath();ctx.arc(lx,ly,lr-20,Math.PI*1.1,Math.PI*1.4);ctx.stroke();
}

/* ---------- sound (engine in kit/kit.js) ---------- */
const {tone,noise}=PS.sound;
let AC=null,hiss=null;
PS.sound.onReady((ac,out,buf)=>{
  AC=ac;
  const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
  const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=3800;bp.Q.value=0.7;
  hiss=ac.createGain();hiss.gain.value=0;
  src.connect(bp);bp.connect(hiss);hiss.connect(out);src.start();
});
const tinkle=(d=0)=>{const f=2300+Math.random()*1300;tone(f,0.4,{type:'triangle',vol:0.07,delay:d});tone(f*1.5,0.3,{vol:0.035,delay:d+0.03})};
const bloop=(f,v=0.14,d=0)=>tone(f,0.13,{vol:v,to:f*2.3,delay:d});
const whoosh=(up,d=0)=>noise(0.75,{f:up?500:3500,to:up?4000:400,q:1.2,vol:0.32,att:0.25,delay:d});
const tick=t=>PS.sound.tick((t+20)/140);
const SIG=[
  ()=>{tinkle();tinkle(0.12);tinkle(0.24)},
  ()=>{bloop(420);bloop(560,0.14,0.16)},
  ()=>whoosh(true)
];
function event(from,to){
  if(to===0){ /* freeze */
    for(let i=0;i<9;i++)noise(0.03,{type:'highpass',f:3000,vol:0.25,delay:i*0.045+Math.random()*0.03});
    [1568,1319,1047].forEach((f,i)=>tone(f,0.35,{type:'triangle',vol:0.1,delay:0.2+i*0.11}));
  }else if(to===1&&from===0){ /* melt */
    bloop(700,0.16);bloop(520,0.16,0.18);bloop(390,0.16,0.36);
  }else if(to===1){ /* condense */
    whoosh(false);bloop(480,0.14,0.45);bloop(620,0.14,0.6);
  }else{ /* boil */
    whoosh(true);tone(1760,0.7,{vol:0.06,delay:0.25});tone(2093,0.5,{vol:0.05,delay:0.45});
  }
}
let nT=0,nB=0;
function ambient(now,temp,a,b){
  if(!hiss)return;
  if(PS.sound.muted()){hiss.gain.setTargetAtTime(0,AC.currentTime,0.1);return}
  const iceAmt=1-a,wat=a*(1-b);
  if(iceAmt>0.5&&now>nT){tinkle();nT=now+1.2+Math.random()*1.8}
  if(wat>0.4&&now>nB){
    if(temp<60){bloop(240+Math.random()*160,0.08);nB=now+1.6+Math.random()*2}
    else{const rate=3+(temp-60)/40*14;bloop(320+Math.random()*600,0.06);nB=now+(0.5+Math.random())/rate}
  }
  hiss.gain.setTargetAtTime(0.07*b+0.035*cl((temp-85)/15)*wat,AC.currentTime,0.15);
}

/* ---------- UI ---------- */
const slider=$('temp'),num=$('num'),numv=$('numv'),badge=$('badge'),hint=$('hint');
const jumps=[$('j0'),$('j1'),$('j2')];
let temp=+slider.value,p=0,shown=0,tw=null,lastTick=Math.round(temp/5);
// The stage warms with the temperature: icy sky when cold, a glow of flame-core when hot.
const BG=[[-20,mix(SKY,ICE,0.5)],[0,mix(ICE,CARD,0.6)],[50,CARD],[100,mix(CARD,FL2,0.22)],[120,mix(CARD,FL2,0.38)]];
function bgFor(t){for(let i=1;i<BG.length;i++)if(t<=BG[i][0]){const[a0,c0]=BG[i-1],[a1,c1]=BG[i];return mix(c0,c1,(t-a0)/(a1-a0))}return BG[BG.length-1][1]}
function setTemp(t){
  temp=t;numv.textContent=(t<0?'−':'')+Math.abs(t);
  slider.setAttribute('aria-valuetext',(t<0?'minus ':'')+Math.abs(t)+' degrees');
  stage.style.backgroundColor=bgFor(t);
  placeHint();
  const tk=Math.round(t/5);if(tk!==lastTick){lastTick=tk;tick(t)}
}
function placeHint(){
  const f=(temp+20)/140;
  hint.style.left='calc(36px + (100% - 72px) * '+f.toFixed(4)+')';
}
function hideHint(){hint.setAttribute('hidden','')}
slider.addEventListener('input',()=>{tw=null;hideHint();setTemp(+slider.value)});
function showState(s,announce,from){
  badge.textContent=WORDS[s];
  badge.classList.remove(...CHIP);badge.classList.add(CHIP[s]);
  slider.style.setProperty('--thumb',FILL[s]);
  jumps.forEach((j,i)=>j.setAttribute('aria-current',i===s?'true':'false'));
  badge.classList.remove('pop');void badge.offsetWidth;badge.classList.add('pop');
  if(announce){event(from,s);PS.say(SAY[s],from===1&&s===0?650:500)}
}
const TARGET=[-15,45,112];
jumps.forEach((j,i)=>j.addEventListener('click',()=>{
  hideHint();
  if(i===shown&&Math.abs(temp-TARGET[i])<40&&((i===0&&temp<=0)||(i===1&&temp>0&&temp<100)||(i===2&&temp>=100))){SIG[i]();PS.say(SAY[i],250);return}
  tw={from:temp,to:TARGET[i],t0:performance.now()/1000,dur:0.9};
}));
badge.addEventListener('click',()=>{SIG[shown]();PS.say(SAY[shown],200)});
num.addEventListener('click',()=>{tick(temp);PS.say((temp<0?'minus ':'')+Math.abs(temp)+' degrees')});
PS.sound.button($('sound'));

/* grown-ups corner: same button or a tap outside closes it */
const gu=$('gu'),gup=$('gupanel');
function guOpen(o){gup.hidden=!o;gu.setAttribute('aria-expanded',o?'true':'false')}
gu.addEventListener('click',()=>{PS.sound.tok();guOpen(gup.hidden)});
document.addEventListener('pointerdown',e=>{if(!gup.hidden&&!gup.contains(e.target)&&!gu.contains(e.target))guOpen(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!gup.hidden){guOpen(false);gu.focus()}});

/* ---------- loop ---------- */
let last=performance.now()/1000,time=0;
function frame(ms){
  const now=ms/1000,dt=Math.min(1/20,now-last);last=now;time+=dt;
  if(tw){
    const u=cl((now-tw.t0)/tw.dur),v=Math.round(tw.from+(tw.to-tw.from)*ease(u));
    if(v!==temp){slider.value=v;setTemp(v)}
    if(u>=1)tw=null;
  }
  const pt=temp<=0?0:temp<100?1:2;
  const step=1.1*dt;p+=cl(pt-p,-step,step);
  const a=cl(p),b=cl(p-1);
  const s=p<0.5?0:p<1.5?1:2;
  if(s!==shown){const from=shown;shown=s;showState(s,true,from)}
  sim(dt,time,temp,a,b);
  draw(time,temp,a,b);
  ambient(now,temp,a,b);
  requestAnimationFrame(frame);
}
setTemp(temp);showState(0,false,0);
requestAnimationFrame(frame);
})();
</script>
